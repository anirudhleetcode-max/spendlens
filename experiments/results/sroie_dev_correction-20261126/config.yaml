# Parser 1.3 vs 1.2 on the SROIE TRAIN split used as a development set. The 1.3 changes (OCR-error
# correction, total fallback skipping cash-tendered lines) were made while reading these errors;
# the test split was re-run only after this.
name: sroie_dev_correction
task: receipt_extraction
dataset: sroie_train
n: 150
seed: 0
variants:
  - {name: parser_1_3, ocr: {preprocess: true, dual: true, psm: 6}}
  - {name: parser_1_3_no_correction, ocr: {preprocess: true, dual: true, psm: 6}, parser: {correct_ocr: false}}
  - {name: parser_1_2, ocr: {preprocess: true, dual: true, psm: 6}, parser: {version: "1.2"}}
